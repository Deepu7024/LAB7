<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math Calculator | Lab 7</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#151b34;color:#f7f9ff;font-family:system-ui,sans-serif}.card{width:min(92vw,500px);padding:38px;border-radius:24px;background:#252d4c;box-shadow:0 25px 75px #0005}.eyebrow{color:#84e2d1;letter-spacing:.2em;font-size:.8rem;font-weight:800}h1{font-size:2.4rem}label{display:block;margin:20px 0 8px;font-weight:700}input{width:100%;padding:15px;border:2px solid #68769e;border-radius:12px;font:inherit;background:#11182e;color:white}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:25px 0}button{font:inherit;font-size:1.5rem;font-weight:800;padding:15px;border:0;border-radius:12px;color:#132c36;background:#83e5d7;cursor:pointer}button:hover{background:#b0fff1}.result{border:2px solid #83e5d7;border-radius:14px;padding:22px;min-height:100px}.result strong{display:block;font-size:2rem;margin-top:5px}#message{color:#ffd091}</style><main class="card"><p class="eyebrow">LAB 7 · JAVASCRIPT</p><h1>Math calculator</h1><p>Enter two numbers and choose an operation.</p><form id="calculator"><label for="first">First number</label><input id="first" type="number" step="any" required placeholder="e.g. 12"><label for="second">Second number</label><input id="second" type="number" step="any" required placeholder="e.g. 4"><div class="buttons"><button type="button" data-op="add" aria-label="Add">+</button><button type="button" data-op="subtract" aria-label="Subtract">−</button><button type="button" data-op="multiply" aria-label="Multiply">×</button><button type="button" data-op="divide" aria-label="Divide">÷</button></div></form><div class="result" aria-live="polite">Result<strong id="output">—</strong><span id="message"></span></div></main><script>const first=document.querySelector('#first'),second=document.querySelector('#second'),output=document.querySelector('#output'),message=document.querySelector('#message');document.querySelectorAll('[data-op]').forEach(button=>button.addEventListener('click',()=>{message.textContent='';if(!first.value||!second.value){output.textContent='—';message.textContent='Enter both numbers.';return}const a=Number(first.value),b=Number(second.value),op=button.dataset.op;if(op==='divide'&&b===0){output.textContent='—';message.textContent='Cannot divide by zero.';return}const result=op==='add'?a+b:op==='subtract'?a-b:op==='multiply'?a*b:a/b;output.textContent=Number.isInteger(result)?String(result):String(Number(result.toFixed(8)))}))</script></html>
